# Only the plugins the stick uses: A2DP and AVRCP (built in) and the rest of BlueZ's core.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap,input,hog,network,midi,neard,wiimote,sixaxis,battery,deviceinfo,scanparam,bap,bass,vcp,mcp,micp,ccp,csip,tmap,gmap,asha,admin,autopair
