# bluetoothd for the btdisk car stick. btdisk sets the name (alias), pairing and discoverability
# from /etc/btdisk.conf; this is what bluetoothd has to know before btdisk is up.
[General]
# Rendering + Audio service, Audio/Video major class, Car audio minor class: phones list the
# stick as a car kit and offer it media audio.
Class = 0x240420
DiscoverableTimeout = 180
PairableTimeout = 0
FastConnectable = true
JustWorksRepairing = always
# Classic only: the phone's audio and remote control are BR/EDR.
ControllerMode = bredr
Experimental = false

[Policy]
AutoEnable = true
ReconnectAttempts = 0
