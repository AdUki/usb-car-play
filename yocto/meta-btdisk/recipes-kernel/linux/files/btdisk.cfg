# The stick's kernel: bcmrpi_defconfig plus this. What the boot needs is built in (no module
# loading before the radio sees the stick), what a stick never uses is off.

# USB device side: dwc2 with a FunctionFS function from configfs.
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_DUAL_ROLE=y
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_F_FS=y

# Bluetooth on the PL011, attached by serdev. The core is built in (it needs RFKILL built in);
# the UART driver stays a module: built in, it would probe before the root filesystem is mounted
# and run the controller without its firmware patch (BCM43430A1.hcd). udev loads it right after.
CONFIG_RFKILL=y
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_BCM=y
CONFIG_BT_BCM=m
CONFIG_SERIAL_DEV_BUS=y
CONFIG_SERIAL_DEV_CTRL_TTYPORT=y

# Full preemption, not PREEMPT_RT: the radio buffers most of a second, so millisecond latency
# does not matter, and RT's threaded interrupts cost CPU on the single ARM11 core.
CONFIG_PREEMPT=y

