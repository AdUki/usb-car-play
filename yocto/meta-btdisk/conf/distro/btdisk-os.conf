# btdisk: a car stick that is a USB flash drive to the radio and an A2DP sink to the phone.
#
# The smallest systemd system that runs bluetoothd and btdisk: no audio server (btdisk is the
# A2DP sink itself), no graphics, no network stack beyond what the dev image's ssh needs.
require conf/distro/poky.conf

DISTRO = "btdisk-os"
DISTRO_NAME = "btdisk car stick"
DISTRO_VERSION = "1.0"
SDK_VENDOR = "-btdisksdk"

# DEV=1 (the Makefile writes BTDISK_DEV into auto.conf) builds the development variant: Wi-Fi in
# power save, ssh, networkd. Everything that differs keys off the btdisk-dev override.
BTDISK_DEV ??= "0"
# TRACE=1: btdisk's log in /data says in detail what the radio and the phone do (log.trace in
# btdisk.conf), for a car test. BTDISK_VERSION: the source it was built from, in that log.
BTDISK_TRACE ??= "0"
BTDISK_VERSION ??= "unknown"
DISTROOVERRIDES .= "${@':btdisk-dev' if d.getVar('BTDISK_DEV') == '1' else ''}"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " bluetooth"
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl ptest nfc 3g alsa pulseaudio pipewire \
                          zeroconf nfs smbfs usbhost pcmcia ext2 xattr acl gobject-introspection-data"
VIRTUAL-RUNTIME_base-utils-syslog = ""
# journald keeps the log in RAM (the root is read-only and the car cuts power without warning).
VIRTUAL-RUNTIME_syslog = ""

# systemd without the parts a stick never uses; each unit left out is one less to start.
SYSTEMD_TRIM = "timesyncd resolved nss-resolve networkd hostnamed localed timedated machined \
                quotacheck backlight rfkill vconsole hibernate userdb homed portabled ldconfig \
                nss-mymachines"
SYSTEMD_TRIM:btdisk-dev = "timesyncd hostnamed localed timedated machined quotacheck backlight \
                           vconsole hibernate userdb homed portabled ldconfig nss-mymachines"
PACKAGECONFIG:remove:pn-systemd = "${SYSTEMD_TRIM}"

# AAC from the phone is decoded by fdk-aac, whose recipe carries LICENSE_FLAGS "commercial"
# (AAC patents): accepted for that recipe alone.
LICENSE_FLAGS_ACCEPTED += "commercial_fdk-aac"

# BlueZ with A2DP and AVRCP; the profiles a car stick never offers are left out.
PACKAGECONFIG:remove:pn-bluez5 = "obex-profiles mesh btpclient midi network-profiles \
                                  hid-profiles hog-profiles health-profiles sap-profiles"
