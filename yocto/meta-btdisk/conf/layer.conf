BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "btdisk"
BBFILE_PATTERN_btdisk = "^${LAYERDIR}/"
BBFILE_PRIORITY_btdisk = "10"
LAYERDEPENDS_btdisk = "core raspberrypi"
LAYERSERIES_COMPAT_btdisk = "scarthgap"
# fdk-aac's license text (not one of poky's common licenses).
LICENSE_PATH += "${LAYERDIR}/licenses"
