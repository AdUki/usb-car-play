# BOARD=rpi0w — Raspberry Pi Zero W (the target: Classic Bluetooth + USB device mode + 5 V from
# the radio's USB port, one cable). Pulled in by conf/auto.conf, which the Makefile writes.

MACHINE = "raspberrypi0-wifi"

# The Raspberry Pi kernel: it carries the PL011 fixes the BCM43430A1 needs under load (mainline
# drops a byte on a full TX FIFO and the controller wedges; see bt-developement-bench docs/dev.md).
PREFERRED_VERSION_linux-raspberrypi = "6.12.%"

# ---------------------------------------------------------------------------
# Boot: straight from the GPU firmware to the kernel, no U-Boot, no initramfs, no splash.
# ---------------------------------------------------------------------------
RPI_USE_U_BOOT = "0"
DISABLE_SPLASH = "1"
DISABLE_RPI_BOOT_LOGO = "1"
BOOT_DELAY = "0"
GPU_MEM = "16"
DISABLE_VC4GRAPHICS = "1"
CMDLINE_DEBUG = "quiet loglevel=3 fastboot"

# dwc2 as a USB device on the OTG port: that port is the "stick" the radio sees.
ENABLE_DWC2_PERIPHERAL = "1"

# Serial console on the GPIO header (mini-UART, 115200): the PL011 belongs to Bluetooth.
ENABLE_UART = "1"

# Bluetooth attached by the kernel's serdev driver at boot (hci_uart + btbcm), not by
# pi-bluetooth's hciuart.service, which is slower and can sit waiting for 90 s.
# The firmware's turbo mode for the first seconds shortens the boot.
RPI_EXTRA_CONFIG = "\n# btdisk\ndtparam=krnbt=on\ninitial_turbo=30\navoid_warnings=1\n${BTDISK_WIFI_CONFIG}"

# Wi-Fi and Bluetooth share one radio on the BCM43430A1: as the A2DP peripheral the bench's Zero W
# lost half of an aptX HD stream to Wi-Fi. The stick has Wi-Fi off; the dev image keeps it, in
# power save, for ssh.
BTDISK_WIFI_CONFIG = "dtoverlay=disable-wifi\n"
BTDISK_WIFI_CONFIG:btdisk-dev = ""
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

BTDISK_WKS = "btdisk-rpi.wks"

# Mounted read-only from the start: nothing ever writes the root.
CMDLINE_ROOTFS = "root=/dev/mmcblk0p2 rootfstype=ext4 rootwait ro"
