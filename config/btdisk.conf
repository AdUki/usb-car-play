# btdisk.txt: the car stick's settings.
#
# This file is on the SD card's "boot" drive, which any PC can open. Edit it there, save it as
# plain text, put the card back in the Pi: the settings apply at the next power-on. Delete a line
# and that setting goes back to how the image was built (/etc/btdisk.conf on the stick, a copy of
# this file as it was flashed). A line btdisk can't read is skipped, with a warning in the log.
#
# On/off settings take true or false (yes/no, on/off and 1/0 work too).

[usb]

# The file system the radio sees.
# fat32: suits nearly every head unit.
# fat16: for the few that only read FAT16. Then files * file_mb must stay under 2 GiB, with
#        cluster_kb = 32.
fat = fat32

# Cluster size in KiB.
# 1, 2, 4, 8, 16, 32 or 64. Leave it at 32 unless a radio needs another.
cluster_kb = 32

# The volume name the radio shows: up to 11 characters, in capitals (longer is cut).
label = BLUETOOTH

# true: the disk has a partition table, like every stick from a shop.
# false: the file system starts at the disk's first sector (a "superfloppy"). Only for a
#        radio that can't read the first kind.
partition_table = true

# What the stick says it is, as a USB device: the maker, the model and the serial number.
vendor = Generic
product = USB Flash Disk

# auto: the Pi's own serial number.
# Any other text: that serial number.
serial = auto

# Whether the radio may write to the stick (some radios save a database or index on it).
# false: writes are accepted but go only to RAM (up to 4 MiB) and are lost at power off;
#        nothing ever reaches the SD card.
# true:  the stick says it is write-protected and refuses every write.
# Leave it false unless your radio misbehaves when it writes.
read_only = false

# Internal, leave as they are: the configfs gadget scripts/btdisk-gadget made, the controller
# to bind it to (auto: the only one there is), and where FunctionFS is mounted.
gadget = /sys/kernel/config/usb_gadget/btdisk
udc = auto
ffs = /dev/ffs-btdisk

[audio]

# The files the radio plays.
# wav: the phone's PCM untouched (no second lossy step, almost no CPU).
# mp3: for the many older head units that play only MP3/WMA/AAC (the Sony this stick was made
#      for among them). Encoded by lame, which takes a good part of a Zero W's CPU.
format = mp3

# Internal, leave as they are: the phone's audio is always 44.1 kHz stereo, and other values
# make it play at the wrong speed.
rate = 44100
channels = 2

# The MP3 bitrate in kbps (constant).
# 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256 or 320.
# Some head units (the Sony among them) play 320 kbps with dropouts.
mp3_kbps = 256

# The volume slider on the phone (AVRCP absolute volume).
# true:  it sets the volume of the audio sent to the radio.
# false: it does nothing; the radio's volume knob is the only one.
apply_volume = true

# SCHED_FIFO priority of the thread that reads the phone's stream, 1..99.
# 0: no real-time priority.
rt_priority = 30

# Keep the phone's clock and the radio's in step: the phone's from the A2DP timestamps, the
# radio's from how it reads, the difference resampled away.
# true:  on.
# false: the PCM passes untouched, and the clocks drift apart (100 ppm is 0.36 s an hour)
#        until the audio skips or drops out.
drift_correction = true

# Seconds over which the radio's clock is measured.
# Shorter follows a change faster; longer is steadier.
drift_period_s = 300

[player]

# The files on the stick, all of them the live stream: "Bluetooth 01.mp3", "Bluetooth 02.mp3", ...
# Sixteen files of 512 MiB: 4 h 40 min of 256 kbps MP3 (50 min of WAV) each before the radio
# moves on by itself. The radio's Next/Previous are told apart by the file it opens: up to
# files/2 - 1 away, so more files allow longer jumps (radios that let you pick a track number).
# file_mb: at most 4095 (FAT's limit is 4 GiB a file).
files = 16
file_mb = 512

# The start of each file's name, before its number.
name_prefix = Bluetooth

# What the tags (artist, title) say.
# phone: the phone's name.
# track: the title and artist of the song playing when the radio opened the file. A radio
#        reads tags only when it opens a file, so the title goes stale at the next song.
tags = phone

# Tags in a LIST/INFO chunk of the WAV header (MP3 always carries ID3v2 and ID3v1 tags).
# false: no tags in WAV files; a few radios read the header as if it were 44 bytes.
# true:  tags in WAV files too.
wav_info = false

# The characters in tags and file names.
# latin1:  accents outside Latin-1 are dropped (č -> c).
# ascii:   all accents are dropped (é -> e).
# unicode: everything kept (UTF-16 ID3 tags and long file names).
charset = latin1

# true:  long file names follow the track ("Artist - Title.wav"). Only radios that re-read the
#        directory on every track change show it; others may get confused.
# false: file names stay as they are.
dynamic_names = false

# How far behind live the radio starts each file, in ms: its cushion against Bluetooth hiccups
# and the latency from phone to speaker, reported to the phone as its delay (for A/V sync). The
# radio adds its own buffering on top, which btdisk can't see. More rides out longer stalls.
target_latency_ms = 200

# A host that reads more at once than that cushion holds (a PC: Linux asks for 120 KiB, 3.75 s
# of 256 kbps MP3) would wait seconds for each read and play in lumps. Then the cushion grows,
# once, to cover such reads (128 KiB + 1 s; at most this), and the phone is told the new delay.
# Radios read a few KiB and keep target_latency_ms; it goes back when the USB host changes.
# 0: never grow.
max_latency_ms = 6000

# Seconds after the radio mounts the stick with no commands to the phone (the radio scans
# tags then).
guard_s = 6

# With tags = track: how long (ms) a header read waits for the phone to report the new track
# after Next/Previous.
metadata_wait_ms = 1500

# The radio's Previous restarts a track that has played a while, and goes to the file before
# when it has played less.
# true:  a restart on the radio restarts the phone's song too (one Previous).
# false: the phone isn't told; its song plays on.
restart_is_previous = true

# That while in seconds, which each radio has its own of (the Sony: about 5 s). btdisk counts a
# read of the file's start only after this much as the radio restarting it; set it to your radio's.
restart_threshold_s = 5

# The phone's own, in seconds: Previous this far into a song restarts it, before that it goes
# back a song (YouTube Music, Spotify: 3 s). So a radio restart this soon after the phone's song
# started (a radio with a track picker that reopens the file) sends nothing.
phone_restart_s = 3

# What the radio plays right after Next/Previous.
# true:  the new file starts on silence, and stays silent until the phone says it has switched
#        (and skip_mute_ms longer: the old song's last packets); then the song fades in. No old
#        song at the start, and no jump when a radio pauses after its first read (the Sony
#        reads 64 ms, waits a second, and btdisk skips ahead to live).
# false: the old song's last moments play into the new file.
skip_mute = true
skip_mute_ms = 300

# Pause the phone when the radio stops reading this many seconds (pause, source switch, off);
# play it again when the radio reads.
# 0: never pause the phone.
pause_after_s = 5

# true:  send Play when the radio reads and the phone is paused (after a mount, or when the
#        phone connects).
# false: the phone starts playing only when you press play on it.
autoplay = false

[bluetooth]

# false: no Bluetooth at all.
enabled = true

# The name phones see.
alias = Car USB

# How a new phone pairs.
# true:  btdisk accepts every phone that pairs while the stick is discoverable (discoverable_s),
#        with no PIN to type or code to confirm, and marks it trusted so it reconnects without
#        asking.
# false: btdisk doesn't answer pairing requests and nothing else on the stick does, so new
#        phones can't pair (phones paired earlier still connect). Only for a setup that runs
#        its own pairing agent, like the test bench.
agent = true

# How long after power-on phones can find the stick, in seconds (pair a new phone within it).
# 0:  always.
# -1: never (only phones paired earlier connect).
discoverable_s = 180

# The role on links the phone opens.
# true:  ask for the central role (the Zero W loses packets as peripheral).
# false: leave it to the phone.
central = true

# While no phone is connected, page the paired ones this often, in seconds (every 5 s for the
# first 3 min after power-on), the one connected last every other time; kept in last_phone_file.
# 0: never; the phone has to connect by itself.
reconnect_s = 15

# Internal, leave as it is.
last_phone_file = /data/last-phone

# true:  tell the phone player.target_latency_ms as the A2DP sink's delay (AVDTP delay
#        reporting), so it can keep video in sync.
# false: don't.
delay_reporting = true

# The A2DP codecs offered, all at 44.1 kHz, as a list separated by spaces:
# aac:     fdk-aac.
# aptx:    libfreeaptx.
# aptx_hd: libfreeaptx. Takes half as much airtime again as aptx (529 vs 352 kbps), for 24-bit
#          samples the 16-bit files cut back down.
# sbc:     always offered, even when not listed.
# The phone picks among them (Android: aptX HD, aptX, AAC, SBC; iPhone: AAC); this order counts
# only when the stick opens the stream itself.
codecs = aac aptx sbc

[log]

# The log is in RAM (logread on the console) unless it goes to a file: then it is kept across
# power cycles, what the radio and the phone did in the car.
# Empty: no file, and the SD card is only written when a phone pairs or changes (BlueZ's
#        pairings, last_phone_file).
# A path: the log goes there, e.g. /data/btdisk.log.
# For a car log, set file = /data/btdisk.log, trace = true and file_kb = 3072 (make image
# TRACE=1 builds them in).
file =

# At this size (KiB) the file moves to <file>.1 and a new one starts.
file_kb = 1024

# true:  log in detail: every pause in the radio's reads, the phone's position and state, how
#        long each Next/Previous took, the muting around them. The system log (bluetoothd, the
#        kernel) is kept in /data/syslog.log as well.
# false: only the main events.
trace = false
