# /etc/btdisk.conf — the car stick's settings. Every key is optional; shown are the defaults.

[usb]
# What the radio sees. FAT32 suits nearly every head unit; fat16 for the few that only read
# FAT16 (then files * file_mb must stay under 2 GiB, with cluster_kb = 32).
fat = fat32
cluster_kb = 32
label = BLUETOOTH
partition_table = true
vendor = Generic
product = USB Flash Disk
# auto = the Pi's serial number
serial = auto
# Writes from the radio (some write a database) are kept in RAM and forgotten at power off.
read_only = false
# The configfs gadget scripts/btdisk-gadget made, and the controller to bind it to.
gadget = /sys/kernel/config/usb_gadget/btdisk
udc = auto
ffs = /dev/ffs-btdisk

[audio]
# wav: the phone's PCM untouched (no second lossy step, almost no CPU). Many older head units
# (the Sony this stick was made for among them) play only MP3/WMA/AAC: then mp3, encoded by
# lame (on the image), which takes a good part of a Zero W's CPU.
format = mp3
rate = 44100
channels = 2
# CBR: 32..320 in the MPEG-1 steps (224, 256, ...). Some head units (the Sony among them) play
# 320 kbps with dropouts.
mp3_kbps = 256
# AVRCP absolute volume from the phone, applied to the PCM. Off: the phone's slider does nothing
# and the radio's volume knob is the only one.
apply_volume = true
# SCHED_FIFO priority of the thread that reads the phone's stream.
rt_priority = 30
# Keep the phone's clock and the radio's in step: the phone's from the A2DP timestamps, the
# radio's from how it reads, the difference resampled away. Off: the PCM passes untouched, and
# the clocks drift apart (100 ppm is 0.36 s an hour) until the audio skips or drops out.
drift_correction = true
# How quickly the radio's clock is followed. Shorter follows faster, longer is steadier.
drift_period_s = 300

[player]
# Sixteen files of 512 MiB: 4 h 40 min of 256 kbps MP3 (50 min of WAV) each before the radio
# moves on by itself. The radio's Next/Previous are told apart by the file it opens: up to
# files/2 - 1 away, so more files allow longer jumps (radios that let you pick a track number).
files = 16
file_mb = 512
name_prefix = Bluetooth
# What the tags say: the phone's name ("phone"), or the title and artist of the song playing
# when the radio opened the file ("track"). A radio reads tags only when it opens a file, so a
# song's title goes stale at the next song; the phone's name does not.
tags = phone
# Tags in a LIST/INFO chunk of the WAV header. Off by default: a few radios read the header as if
# it were 44 bytes. MP3 always carries ID3v2 and ID3v1 tags.
wav_info = false
# latin1: accents outside Latin-1 are dropped (č -> c); ascii; unicode (UTF-16 ID3 and names).
charset = latin1
# Long file names follow the track ("Artist - Title.wav"). Only radios that re-read the directory
# on every track change show it; others may get confused, so it is off.
dynamic_names = false
# How far behind live the radio starts each file: its cushion against Bluetooth hiccups and
# the latency from phone to speaker, reported to the phone as its delay (for A/V sync). The
# radio adds its own buffering on top, which btdisk can't see. More rides out longer stalls.
target_latency_ms = 200
# No phone commands for this long after the radio mounts the stick (it scans tags then).
guard_s = 6
# With tags = track: how long a header read waits for the phone to report the new track after
# Next/Previous.
metadata_wait_ms = 1500
# The radio's Previous restarts a track that has played a while, and goes to the file before
# when it has played less: then the phone restarts its song too (one Previous).
restart_is_previous = true
# That while, which each radio has its own of (the Sony: about 5 s). btdisk counts a read of the
# file's start only after this much as the radio restarting it; set it to your radio's.
restart_threshold_s = 5
# The phone's own: Previous this far into a song restarts it, before that it goes back a song
# (YouTube Music, Spotify: 3 s). So a radio restart this soon after the phone's song started
# (a radio with a track picker that reopens the file) sends nothing.
phone_restart_s = 3
# On Next/Previous the new file starts on silence, and the phone stays silent until it says it
# has switched (and skip_mute_ms longer: the old song's last packets) and the radio streams the
# file; then the song fades in. No old song at the start, and no jump when a radio pauses after
# its first read (the Sony reads 64 ms, waits a second, and btdisk skips ahead to live).
skip_mute = true
skip_mute_ms = 300
# Pause the phone when the radio stops reading this long (pause, source switch, off); play it
# again when the radio reads. 0 turns it off.
pause_after_s = 5
# Send Play when the radio reads and the phone is paused (after a mount, or when the phone
# connects). Off: the phone starts playing only when you press play on it.
autoplay = false

[bluetooth]
enabled = true
alias = Car USB
# Pair without a PIN (NoInputNoOutput) and trust the phone.
agent = true
# Discoverable for this long after power on (pair a new phone within it); 0 = always, -1 = never.
discoverable_s = 180
# Ask for the central role on links the phone opens (the Zero W loses packets as peripheral).
central = true
# While no phone is connected, page the paired ones this often (every 5 s for the first 3 min
# after power-on), the one connected last every other time; kept in last_phone_file.
reconnect_s = 15
last_phone_file = /data/last-phone
# Report player.target_latency_ms to the phone as the A2DP sink's delay (AVDTP delay reporting).
delay_reporting = true
# The A2DP codecs offered, all at 44.1 kHz: aac (fdk-aac), aptx, aptx_hd (libfreeaptx), sbc
# (always offered). The phone picks among them (Android: aptX HD, aptX, AAC, SBC; iPhone: AAC);
# this order counts only when the stick opens the stream itself. aptx_hd takes half as much
# airtime again as aptx (529 vs 352 kbps), for 24-bit samples the 16-bit files cut back down.
codecs = aac aptx sbc

[log]
# The log is in RAM (logread on the console) unless it goes to a file: then it is kept across
# power cycles, what the radio and the phone did in the car. Empty: no file, and the SD card is
# only written when a phone pairs or changes (BlueZ's pairings, last_phone_file). make image
# TRACE=1 sets file = /data/btdisk.log, trace = true and file_kb = 3072. At file_kb the file
# moves to <file>.1.
file =
file_kb = 1024
# In detail: every pause in the radio's reads, the phone's position and state, how long each
# Next/Previous took, the muting around them. With TRACE=1 the system log (bluetoothd, kernel)
# is kept in /data/syslog.log as well.
trace = false
